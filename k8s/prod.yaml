apiVersion: v1
kind: Secret
metadata:
  name: gp-prod-db
  namespace: gp-prod
type: Opaque
stringData:
  DB_DRIVER: mysql
  DB_HOST: gp-prod-mysql
  DB_NAME: gestion_produits
  DB_USER: root
  DB_PASSWORD: root
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gp-prod-uploads
  namespace: gp-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gp-prod-app
  namespace: gp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gp-prod-app
  template:
    metadata:
      labels:
        app: gp-prod-app
    spec:
      containers:
        - name: app
          image: gestion-produits:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gp-prod-db
          ports:
            - containerPort: 80
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gp-prod-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: gp-prod-app
  namespace: gp-prod
spec:
  selector:
    app: gp-prod-app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gp-prod-mysql-data
  namespace: gp-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gp-prod-mysql-init
  namespace: gp-prod
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS gestion_produits;
    USE gestion_produits;

    CREATE TABLE IF NOT EXISTS produits (
      id int NOT NULL AUTO_INCREMENT,
      nom varchar(255) NOT NULL,
      prix float NOT NULL,
      quantite int NOT NULL,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS ressources (
      id int NOT NULL AUTO_INCREMENT,
      titre varchar(255) NOT NULL,
      auteur varchar(255) NOT NULL,
      type varchar(255) NOT NULL,
      url text NOT NULL,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS utilisateurs (
      id int NOT NULL AUTO_INCREMENT,
      login varchar(255) NOT NULL,
      password varchar(255) NOT NULL,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    INSERT INTO utilisateurs (login, password) VALUES ('admin','password');
    INSERT INTO produits (nom, prix, quantite) VALUES
      ('Clavier', 10, 2),
      ('Souris', 15, 20),
      ('Ecran', 50, 12);
    INSERT INTO ressources (titre, auteur, type, url) VALUES
      ('La richesse des Nations', 'Adam Smith', 'Livre', 'https://fr.wikipedia.org/wiki/Recherches_sur_la_nature_et_les_causes_de_la_richesse_des_nations'),
      ('La République', 'Platon', 'Livre', 'https://fr.wikipedia.org/wiki/La_R%C3%A9publique'),
      ('Discours de la méthode', 'René Descartes', 'Livre', 'https://fr.wikipedia.org/wiki/Discours_de_la_m%C3%A9thode');
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gp-prod-mysql
  namespace: gp-prod
spec:
  serviceName: gp-prod-mysql
  replicas: 1
  selector:
    matchLabels:
      app: gp-prod-mysql
  template:
    metadata:
      labels:
        app: gp-prod-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: gestion_produits
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: gp-prod-mysql-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gp-prod-mysql
  namespace: gp-prod
spec:
  selector:
    app: gp-prod-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gp-prod
  namespace: gp-prod
spec:
  rules:
    - host: gestion-produits.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gp-prod-app
                port:
                  number: 80
