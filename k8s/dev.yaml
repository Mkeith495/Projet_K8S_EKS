apiVersion: v1
kind: Secret
metadata:
  name: gp-dev-db
  namespace: gp-dev
type: Opaque
stringData:
  DB_DRIVER: pgsql
  DB_HOST: gp-dev-postgres
  DB_NAME: gestion_produits
  DB_USER: postgres
  DB_PASSWORD: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gp-dev-uploads
  namespace: gp-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gp-dev-app
  namespace: gp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gp-dev-app
  template:
    metadata:
      labels:
        app: gp-dev-app
    spec:
      containers:
        - name: app
          image: gestion-produits:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gp-dev-db
          ports:
            - containerPort: 80
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gp-dev-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: gp-dev-app
  namespace: gp-dev
spec:
  selector:
    app: gp-dev-app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gp-dev-postgres-init
  namespace: gp-dev
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS produits (
      id SERIAL PRIMARY KEY,
      nom VARCHAR(255) NOT NULL,
      prix REAL NOT NULL,
      quantite INTEGER NOT NULL
    );

    CREATE TABLE IF NOT EXISTS ressources (
      id SERIAL PRIMARY KEY,
      titre VARCHAR(255) NOT NULL,
      auteur VARCHAR(255) NOT NULL,
      type VARCHAR(255) NOT NULL,
      url TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS utilisateurs (
      id SERIAL PRIMARY KEY,
      login VARCHAR(255) NOT NULL,
      password VARCHAR(255) NOT NULL
    );

    INSERT INTO utilisateurs (login, password) VALUES ('admin','password');
    INSERT INTO produits (nom, prix, quantite) VALUES
      ('Clavier', 10, 2),
      ('Souris', 15, 20),
      ('Ecran', 50, 12);
    INSERT INTO ressources (titre, auteur, type, url) VALUES
      ('La richesse des Nations', 'Adam Smith', 'Livre', 'https://fr.wikipedia.org/wiki/Recherches_sur_la_nature_et_les_causes_de_la_richesse_des_nations'),
      ('La République', 'Platon', 'Livre', 'https://fr.wikipedia.org/wiki/La_R%C3%A9publique'),
      ('Discours de la méthode', 'René Descartes', 'Livre', 'https://fr.wikipedia.org/wiki/Discours_de_la_m%C3%A9thode');
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gp-dev-postgres
  namespace: gp-dev
spec:
  serviceName: gp-dev-postgres
  replicas: 1
  selector:
    matchLabels:
      app: gp-dev-postgres
  template:
    metadata:
      labels:
        app: gp-dev-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: gestion_produits
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: gp-dev-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gp-dev-postgres
  namespace: gp-dev
spec:
  selector:
    app: gp-dev-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gp-dev
  namespace: gp-dev
spec:
  rules:
    - host: gestion-produits-dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gp-dev-app
                port:
                  number: 80
