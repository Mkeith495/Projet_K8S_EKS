services:
  app-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - DB_DRIVER=pgsql
      - DB_HOST=db-dev
      - DB_NAME=gestion_produits
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - uploads_dev:/var/www/html/uploads
    depends_on:
      - db-dev
    networks:
      - web
      - internal
      - internal-dev

  db-dev:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gestion_produits
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal-dev

volumes:
  pg_data:
  uploads_dev:

networks:
  web:
    external: true
    name: web
  internal:
    external: true
    name: gestion-produits_internal
  internal-dev:
    internal: true
