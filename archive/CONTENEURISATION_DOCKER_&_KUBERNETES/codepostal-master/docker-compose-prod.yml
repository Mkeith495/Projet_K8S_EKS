services:
    php:      
        image: mkeith495/codepostal-php:latest
          - ./php/www:/var/www/html
        ports:
            - "8081:80"
        environment:
          - DB_HOST=${DB_HOST}
          - DB_PORT=${DB_PORT}
          - DB_NAME=${DB_NAME}
          - DB_USER=${DB_USER}
          - DB_PASSWORD=${DB_PASSWORD}
        restart: unless-stopped
    
    mysql:
        build:
            context: ./mysql
        image: anthonymasset/codepostal-mysql:latest
        volumes:
          - mysql-app-data:/var/lib/mysql
        ports:
          - 3306:3306
        environment:
          - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        restart: unless-stopped

volumes:
    mysql-app-data:
